{% extends "base.html" %}

{% block title %}Complaint Heatmap - CivicSightAI{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
    body {
        margin: 0;
        padding: 0;
    }
    
    /* Map Container - Very explicit styles */
    #map {
        width: 100vw !important;
        height: 100vh !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 1000 !important;
        background-color: #e0e0e0 !important;
    }
    
    /* Override any potential conflicts */
    .leaflet-container {
        width: 100% !important;
        height: 100% !important;
        background-color: #e0e0e0 !important;
    }
    
    /* Close button */
    .close-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1001;
        background: #333;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }
</style>
{% endblock %}

{% block content %}
<button class="close-btn" onclick="window.location.href='/'">✕ Close Map</button>
<div id="map"></div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded, initializing map...');
    
    // Initialize map
    const map = L.map('map').setView([19.0760, 72.8777], 11);
    console.log('Map initialized');
    
    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    console.log('Tile layer added');
    
    // No heatmap data - just clean Mumbai map
    console.log('Clean Mumbai map loaded');
    
    // Force map resize after a short delay
    setTimeout(function() {
        map.invalidateSize();
        console.log('Map size invalidated');
    }, 100);
    
    console.log('Map initialization complete');
});
</script>
{% endblock %}
